spring.application.name=ELLAS

# Los datos sensibles (contraseñas, claves) NO van en este archivo: se leen de variables de
# entorno o del archivo .env de esta carpeta, que no se sube a GitHub. Plantilla: .env.example
spring.config.import=optional:file:.env[.properties]

# Base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ellas}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_PASSWORD}

# Detrás de Nginx: respeta X-Forwarded-Proto/Host para que Spring sepa que la petición llegó por https
# (sin esto, CORS y el WebSocket rechazan las peticiones del propio dominio)
server.forward-headers-strategy=native

# Crea/actualiza las tablas automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Orígenes permitidos para CORS y WebSocket (separados por coma). 5173 es el frontend de Vite.
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# Devuelve al frontend el texto de los errores (p. ej. "El correo ya está registrado")
spring.web.error.include-message=always

# JWT (tokens de sesión): clave de mínimo 32 caracteres, siempre desde JWT_SECRETO
app.jwt.secreto=${JWT_SECRETO}
# Días que dura la sesión antes de pedir iniciar sesión otra vez
app.jwt.dias=30

# Evidencias de audio (alertas del dije): se guardan CIFRADAS (AES-256-GCM) en este directorio.
# La clave NO va aquí: EVIDENCIAS_CLAVE son 32 bytes en base64 (openssl rand -base64 32).
# Si se pierde la clave, las evidencias ya guardadas no se pueden recuperar: respáldala aparte.
app.evidencias.directorio=${EVIDENCIAS_DIR:evidencias}
app.evidencias.clave=${EVIDENCIAS_CLAVE}
# Espacio máximo de evidencias por usuaria
app.evidencias.max-mb-por-usuaria=${EVIDENCIAS_MAX_MB:500}
# Spring Cloud Gateway (en el pom) desactiva multipart por defecto: sin esto la subida de audios no lee el formulario
spring.servlet.multipart.enabled=true
# Un clip de 5 min en WAV 16 kHz/16 bit pesa ~9.6 MB
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB
