spring.application.name=ELLAS

# Los datos sensibles (contraseñas, claves) NO van en este archivo: se leen de variables de
# entorno o del archivo .env de esta carpeta, que no se sube a GitHub. Plantilla: .env.example
spring.config.import=optional:file:.env[.properties]

# Base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ellas}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_PASSWORD}

# Detrás de Nginx: respeta X-Forwarded-Proto/Host para que Spring sepa que la petición llegó por https
# (sin esto, CORS y el WebSocket rechazan las peticiones del propio dominio)
server.forward-headers-strategy=native

# Crea/actualiza las tablas automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Orígenes permitidos para CORS y WebSocket (separados por coma). 5173 es el frontend de Vite.
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# Los mensajes de error que ve la usuaria los arma ManejadorDeErrores; Spring no debe añadir
# textos internos de excepciones, trazas ni detalles de validación.
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# Solo escucha en local: la única entrada pública es Nginx (que fija X-Forwarded-For).
# Si necesitas probar desde otro equipo en desarrollo: SERVER_ADDRESS=0.0.0.0
server.address=${SERVER_ADDRESS:127.0.0.1}

# JWT (tokens de sesión): clave de mínimo 32 caracteres, siempre desde JWT_SECRETO
app.jwt.secreto=${JWT_SECRETO}
# Días que dura la sesión antes de pedir iniciar sesión otra vez
app.jwt.dias=30
