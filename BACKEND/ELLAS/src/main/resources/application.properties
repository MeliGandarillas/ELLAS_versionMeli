spring.application.name=ELLAS

# Los datos sensibles (contraseñas, claves) NO van en este archivo: se leen de variables de
# entorno o del archivo .env de esta carpeta, que no se sube a GitHub. Plantilla: .env.example
spring.config.import=optional:file:.env[.properties]

# Base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ellas}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_PASSWORD}

# Crea/actualiza las tablas automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Orígenes permitidos para CORS y WebSocket (separados por coma). 5173 es el frontend de Vite.
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# Devuelve al frontend el texto de los errores (p. ej. "El correo ya está registrado")
spring.web.error.include-message=always

# JWT (tokens de sesión): clave de mínimo 32 caracteres, siempre desde JWT_SECRETO
app.jwt.secreto=${JWT_SECRETO}
# Días que dura la sesión antes de pedir iniciar sesión otra vez
app.jwt.dias=30
