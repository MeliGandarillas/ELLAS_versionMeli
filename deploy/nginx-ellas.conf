# Nginx para ELLAS en una sola máquina EC2.
# Sirve el frontend (carpeta dist) y redirige /api y /ws al backend (Spring Boot en el puerto 8080).
#
# Instalar en el servidor:
#   sudo cp nginx-ellas.conf /etc/nginx/conf.d/ellas.conf
#   (si cambian de dominio, se cambia en "server_name" más abajo)
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (obligatorio: sin https el navegador no da la ubicación):
#   sudo certbot --nginx -d 3-133-109-72.sslip.io
#   Certbot agrega solo el bloque del puerto 443 y la redirección de http a https.

# Límites por IP (el backend ya limita login/registro; esto frena el abuso antes de llegar a él)
limit_req_zone $binary_remote_addr zone=ellas_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ellas_login:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ellas_conn:10m;

server {
    listen 80;
    server_name 3-133-109-72.sslip.io;

    # Frontend: contenido de FRONTEND/dist
    root /var/www/ellas;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;
    limit_conn ellas_conn 30;

    # Cabeceras de seguridad (always: también en errores). Se repiten en /assets/ porque
    # un add_header dentro de un location anula los del nivel superior.
    # No hay Content-Security-Policy porque el chatbot (Botpress) carga scripts de otros dominios.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), bluetooth=(self), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de /assets llevan un código único en el nombre: se pueden guardar en caché
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Login: más estricto que el resto de la API
    location = /api/usuarios/login {
        limit_req zone=ellas_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr (no $proxy_add_x_forwarded_for): así el cliente no puede inventar su IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API REST -> backend
    location /api/ {
        limit_req zone=ellas_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket de ubicaciones en vivo -> backend
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La conexión queda abierta mucho tiempo: que Nginx no la corte por inactividad
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
