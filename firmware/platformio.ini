; Firmware del dije ELLAS - Seeed XIAO ESP32-S3 (8 MB flash, 8 MB PSRAM OPI)
;   pio run                 compila
;   pio run -t upload       graba el firmware
;   pio run -t uploadfs     (no hace falta: LittleFS se formatea sola en el primer arranque)
;   pio device monitor      consola serie (USB)
[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
build_src_flags = -Wall -Wextra

; Igual, pero con el GPS ATGM336H activado (aún no soldado: sirve para comprobar que compila)
[env:xiao_esp32s3_gps]
extends = env:xiao_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DGPS_ENABLED=1
